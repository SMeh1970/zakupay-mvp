name: Zakupay ingestion paused

# Gmail ingestion and Zakupay API polling are intentionally disabled.
# Existing saved applications and the Render dashboard are unaffected.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm paused state
        run: echo "Gmail ingestion and Zakupay API polling are disabled."
