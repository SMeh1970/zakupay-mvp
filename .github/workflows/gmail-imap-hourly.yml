name: Poll Zakupay API hourly

on:
  push:
    branches:
      - main
      - ai-analysis-v1
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get and process prepayment orders from Zakupay API
        run: |
          OIDC_TOKEN="$(curl --fail-with-body --show-error --silent \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zakupay-mvp" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://zakupay-mvp.onrender.com/automation/api/poll"
