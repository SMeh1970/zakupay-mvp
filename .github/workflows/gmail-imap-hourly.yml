name: Process Zakupay API orders
# Zakupay API is the source of truth; Gmail forwarding is no longer used.

on:
  push:
    branches:
      - ai-analysis-v1
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Process current prepayment orders
        run: |
          OIDC_TOKEN="$(curl --fail-with-body --show-error --silent \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zakupay-mvp" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail-with-body --show-error --silent \
            --max-time 1500 \
            --retry 2 \
            --retry-delay 15 \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            https://zakupay-mvp.onrender.com/automation/api/poll
