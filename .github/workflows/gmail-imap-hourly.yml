name: Process Zakupay API orders

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Process current prepayment orders
        env:
          ZAKUPAY_EMAIL_WEBHOOK_SECRET: ${{ secrets.ZAKUPAY_EMAIL_WEBHOOK_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --max-time 1500 \
            --retry 2 \
            --retry-delay 15 \
            -X POST \
            -H "X-Webhook-Secret: ${ZAKUPAY_EMAIL_WEBHOOK_SECRET}" \
            https://zakupay-mvp.onrender.com/automation/api/poll
