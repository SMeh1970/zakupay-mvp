name: Forward Zakupay Gmail messages
# Validate Russian Gmail Drafts mailbox.

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/gmail-imap-hourly.yml"]

concurrency:
  group: zakupay-gmail-hourly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Forward verified Zakupay messages
        env:
          GMAIL_IMAP_EMAIL: "1043324@gmail.com"
          GMAIL_IMAP_APP_PASSWORD: ${{ secrets.GMAIL_IMAP_APP_PASSWORD }}
          ZAKUPAY_EMAIL_WEBHOOK_SECRET: ${{ secrets.ZAKUPAY_EMAIL_WEBHOOK_SECRET }}
          WEBHOOK_URL: "https://zakupay-mvp.onrender.com/automation/email/ingest"
          START_AFTER: "1789333200"
          GMAIL_MAX_MESSAGES_PER_RUN: "1"
        run: python gmail_imap_forwarder.py
