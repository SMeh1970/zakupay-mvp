<title>Подбор товаров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: working bench — position tabs on top, words (decisions) left, resulting products right; stacks on phones. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --fg:#1d221f; --muted:#5f6a63; --line:#d7dcd6;
  --ok:#2f6b3f; --ok-bg:#e2f1e5; --no:#9a3a2a; --no-bg:#f6e3dd; --accent:#3d5a80; --accent-bg:#e4ebf4; --warn-bg:#fbf1d6; --warn:#7a5a12;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; /* plain zeros: the monospace face drew 0 with a dot */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151916; --panel:#1d221f; --fg:#e7ebe6; --muted:#9aa59d; --line:#323a35;
  --ok:#8fd19f; --ok-bg:#1f3a27; --no:#f0a493; --no-bg:#43231c; --accent:#9db8dc; --accent-bg:#22303f; --warn-bg:#3b3118; --warn:#e8c76a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151916; --panel:#1d221f; --fg:#e7ebe6; --muted:#9aa59d; --line:#323a35;
  --ok:#8fd19f; --ok-bg:#1f3a27; --no:#f0a493; --no-bg:#43231c; --accent:#9db8dc; --accent-bg:#22303f; --warn-bg:#3b3118; --warn:#e8c76a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:14px}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-bg)}
.tab.add{color:var(--accent)}
.req{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.req b{font-size:17px}
.req .meta{color:var(--muted);font-family:var(--mono);font-size:13px}
.grid{display:grid;grid-template-columns:fit-content(250px) minmax(0,1fr);gap:14px;align-items:start}
/* Half a screen still shows filters and table side by side; one column only on a phone. */
@media (max-width:1100px){.grid{grid-template-columns:fit-content(200px) minmax(0,1fr);gap:10px}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.panel h2{font-size:15px;margin:0 0 6px;font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:0 0 8px}
.chosen{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:2px 4px 2px 8px;font-family:var(--mono);font-size:13px}
.tag.acc{background:var(--ok-bg);color:var(--ok)} .tag.rej{background:var(--no-bg);color:var(--no)}
.tag button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;padding:0 4px;line-height:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.words{display:flex;flex-wrap:wrap;gap:5px}
/* Filter list like a shop sidebar: one value per line, marks on the right. */
.w{border-color:transparent;background:var(--bg)}
/* Status fills, the same everywhere: filters, table values, close products, «Отбор». */
.s-only{background:var(--ok-bg)!important;color:var(--ok)!important}
.s-also{background:var(--warn-bg)!important;color:var(--warn)!important}
.s-rejected{background:var(--no-bg)!important;color:var(--no)!important}
/* A frame only on your own marks, in the colour of the mark. */
/* Fill — the value matches the request (and is applied); frame — your own mark: ✓ green, + yellow, ✕ red. */
/* The frame is drawn inside the value, so marking never changes its width (no jump to the next line). */
.mk.mk-only{box-shadow:inset 0 0 0 1px var(--ok)!important} .mk.mk-also{box-shadow:inset 0 0 0 1px var(--warn)!important} .mk.mk-rejected{box-shadow:inset 0 0 0 1px var(--no)!important}
.framed{border-width:2px!important;border-style:solid!important}
.framed.s-only{border-color:var(--ok)!important} .framed.s-also{border-color:var(--warn)!important} .framed.s-rejected{border-color:var(--no)!important}
.cmp{border:1px solid transparent;background:var(--bg)}
.cmp.same{color:var(--fg)}
.rubric .words{flex-direction:column;flex-wrap:nowrap;gap:3px}
.rubric .words .w{display:flex;width:100%;box-sizing:border-box;overflow-wrap:anywhere;padding-left:6px}
.rubric .words .w button{width:20px}
.rubric .words .w .n{margin-right:auto}
.more{border:0;background:transparent;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:2px 0;text-align:left}
.w{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:6px;padding:2px 2px 2px 7px;font-family:var(--mono);font-size:13px;background:var(--panel)}
.w .n{color:var(--muted);margin-left:3px}
.w button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;width:24px;height:24px;border-radius:4px}
.w button:hover{background:var(--accent-bg)}
.w.req{border-color:var(--ok)}
.w.fill{background:var(--ok-bg);color:var(--ok)}
.w.user{border-width:2px;border-color:var(--ok);font-weight:600}
.w.user.rej{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.w button.bk{color:var(--ok)} .w button.ba{color:var(--warn);font-weight:700} .w button.bx{color:var(--no)}
.w button[aria-pressed="true"]{font-weight:700}
.w button.bk[aria-pressed="true"]{background:var(--ok-bg)} .w button.ba[aria-pressed="true"]{background:var(--warn-bg)}
.w.user.also{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.w button.bx[aria-pressed="true"]{color:var(--no);background:var(--no-bg)}
.w.auto-rej{opacity:.5;text-decoration:line-through} .w.dim{opacity:.55}
.tag.also{background:var(--warn-bg);color:var(--warn)}
.tag.framed.acc{box-shadow:none;border-width:1px!important;border-color:var(--ok)!important} .tag.framed.also{box-shadow:inset 0 0 0 2px var(--warn)} .tag.framed.rej{box-shadow:inset 0 0 0 2px var(--no)}
.summary{font-size:14px;margin:0 0 8px}
.totals{margin:0;font-size:15px}
.summary-table{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.summary-table .sumrow{cursor:pointer}
.summary-table .sumrow:hover td,.summary-table .sumrow.open td{background:var(--accent-bg)}
.summary-table .workrow>td{padding:12px;background:var(--bg)}
.caret{color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;white-space:nowrap;border:1px solid currentColor}
.pill.done{color:var(--ok)} .pill.todo{color:var(--warn)} .pill.miss{color:var(--no)} .pill.none{color:var(--muted)}
.aipanel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.aipanel summary{cursor:pointer;font-weight:600}
.aipick{margin-bottom:14px}
.ask{display:grid;gap:6px;margin:8px 0}
.ask-msg{white-space:pre-wrap;padding:6px 10px;border-radius:8px;font-size:14px;max-width:90ch}
.ask-msg.q{background:var(--accent-bg);justify-self:end}
.ask-msg.a{background:var(--bg);border:1px solid var(--line)}
.ask-row{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.ask-row textarea{flex:1 1 300px;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.posnav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.analog{display:inline-block;margin-top:2px;font-size:12px;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.offers tr.sep td{background:var(--bg);font-weight:600;color:var(--warn);border-top:2px solid var(--muted)}
.neardiff{font-size:12px;color:var(--warn);margin-top:2px}
details.near summary{color:var(--warn);font-weight:600}
.cmprow{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.cmp{font-size:12px;border-radius:4px;padding:0 5px;border:1px solid transparent}
.cmp.diff{color:var(--no);display:inline-flex;align-items:center;gap:4px}
/* The difference itself is a light red label; the two crosses stand out from it. */
.cmp.diff{background:var(--no-bg);border-color:transparent;padding:1px 2px 1px 6px}
/* «✕ этот» — red, «✕ у всех» — black. */
.xbtn{border:0;background:transparent;color:var(--no);font:inherit;font-size:15px;font-weight:700;line-height:1;padding:0 3px;cursor:pointer}
.xbtn.all{color:var(--fg)}
.xbtn:hover{filter:brightness(.92)}
.anchormark{font-size:12px;font-weight:600;color:var(--accent)}
.offers td .anchorbtn{display:block;margin-top:4px;font-size:12px}
.btn.anchorbtn.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.chosen{border-color:var(--ok);color:var(--ok);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.rubric{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:grid;gap:6px}
.assign{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;padding:6px 8px;background:var(--accent-bg);border-radius:6px}
.assign select,.assign input{font:inherit;font-size:14px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--fg)}
.legend{display:grid;gap:6px;margin:6px 0 10px}
.legend{grid-template-columns:max-content minmax(0,1fr);column-gap:10px}
.legend-row{display:contents;font-size:13px;color:var(--muted)}
.legend-row>span:last-child{font-size:13px;color:var(--muted);align-self:center}
.legend-row .w{pointer-events:none;white-space:nowrap;justify-self:start}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.help{flex:0 0 auto}
.help summary{list-style:none;cursor:pointer;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;color:var(--muted);font-size:14px}
.help summary::-webkit-details-marker{display:none}
.help[open] summary{border-color:var(--accent);color:var(--accent)}
.help-body{position:absolute;z-index:20;left:0;top:44px;width:min(480px,calc(100vw - 48px));background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .18);padding:12px 14px}
.help-close{position:absolute;top:6px;right:8px;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
.panel{position:relative}
.w.head{padding:0;background:transparent;border:0;box-shadow:none}
.rubric-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.summary b{font-family:var(--mono)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:11px;line-height:1.25}
.offers tr.group th{text-align:center;color:var(--fg);border-bottom:1px solid var(--line)}
/* Groups are framed by rules, not by fills. */
.offers .g-start{border-left:2px solid var(--muted)} .offers .g-end{border-right:2px solid var(--muted)}
.offers tr.group th{border-top:2px solid var(--muted);border-bottom:2px solid var(--muted)}
.offers tbody tr:last-child td{border-bottom:2px solid var(--muted)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
/* Rows: green — has the ✓ values, yellow — shown thanks to + (analog). */
.offers tr.main td{background:color-mix(in srgb,var(--ok-bg) 60%,transparent)}
.offers tr.alt td{background:color-mix(in srgb,var(--warn-bg) 70%,transparent)}
/* The name as filters: parts are plain text with a dotted underline until marked. */
/* Every clickable part of the name is blue, like a link; your mark adds a thin coloured frame. */
/* The same blue for values in the filter column and under the name: what is blue can be clicked. */
.rubric .words .w,.rowvals .w.cyc{color:#2b5fb4}
.pname .w.cyc.inl{display:inline;font:inherit;font-size:inherit;padding:0 2px;border:0;border-radius:3px;background:transparent;color:#2b5fb4;line-height:inherit;box-shadow:inset 0 0 0 1px #c9d0ca}
.pname .w.cyc.inl:hover{background:var(--accent-bg)}
.pname .pgroup{display:inline;white-space:nowrap} /* one designation stays on one line; no box around it */

/* Comparing products side by side: what differs among the ticked products is outlined in orange
   (an outline, so the status fill of the value stays as it is). */
:root{--cmp:#d9730d}
.w.cmp-diff{background:#fbe1c6!important;color:#8a4508!important}
.cmp-miss{display:inline-block;font-size:12px;color:var(--cmp);border:1px dashed var(--cmp);border-radius:4px;padding:0 5px}
.offers tr.compared td:nth-child(3){box-shadow:inset 3px 0 0 var(--cmp)}
.cmpbox{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.cmpbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--cmp);margin:0 0 8px}
.bestmark{display:inline-block;margin-left:4px;font-size:12px;color:var(--ok);font-weight:600}
.rowvals{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.rowvals .w{font-size:12px;padding:0 0 0 5px}
.rowvals .w.cyc{padding:1px 7px;cursor:pointer;font:inherit;font-size:12px;color:var(--fg)}
.rowvals .w.cyc:hover{border-color:var(--accent)}
.rowvals .w.m-only{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.rowvals .w.m-also{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.rowvals .w.m-rej{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.conv{display:block;font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:1px 6px;margin-top:3px;width:fit-content}
.why{font-size:12px;color:var(--no)}
details.out{margin-top:12px}
details.out summary{cursor:pointer;color:var(--muted);font-size:14px}
tr.out td{color:var(--muted)}
form.add{display:grid;gap:8px}
form.add label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
form.add input,form.add textarea{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
form.add textarea{min-height:180px;font-family:var(--mono);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>label{flex:1 1 140px}
.note{font-size:12px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* APP: строка ссылок и сообщения о сохранении; поставщик и фото под названием товара */
.supplier-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.photo-btn{font:inherit;font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);cursor:pointer}
.supplier-line img.photo{display:block;max-width:240px;max-height:240px;margin:6px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
.appnav{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:0 0 6px}.appnav a{color:var(--accent)}
.app-status{font-size:13px;color:var(--muted);min-height:1em;margin:4px 0 0}.app-status.error{color:var(--no)}
</style>

<div class="wrap">
  <header>
    <p class="appnav" id="app-nav"></p>
    <h1 id="app-title">Подбор товаров</h1>
    <p class="sub">Сводка по позициям заявки, нажатие на строку открывает отбор. Отметки применяются сразу; «Выбрать» переносит товар в счёт.</p>
    <p class="app-status" id="app-status" role="status"></p>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Позиции"></nav>
  <section id="main"></section>
</div>

<script>
(() => {
/* APP: позиции заявки и сохранённые решения приходят из приложения (вместо примеров стенда). */
const APP=JSON.parse(document.getElementById('podbor-data').textContent);
const EXAMPLES=APP.positions;

/* ---------- Storage (per viewer convenience) ---------- */
/* APP: решения хранятся в приложении, а не в браузере. Позиции заявки берутся свежими из приложения,
   свои позиции и отметки — из сохранённого состояния; «Выбрано» по позициям заявки — то, что сейчас в счёте. */
/* APP.local — the claude.ai stand built from this same file (scripts/build_podbor_stand.py):
   decisions stay in the browser, nothing is sent anywhere. */
const LOCAL_KEY='podbor-stand-v2';
if(APP.local){try{APP.state=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null')}catch(e){APP.state=null}}
const load=()=>{
  const s=APP.state&&typeof APP.state==='object'?APP.state:{};
  const appIds=new Set(APP.positions.map(p=>p.id));
  const own=(s.positions||[]).filter(p=>p&&!appIds.has(p.id)&&!p.app);
  const chosen={};
  for(const[k,v]of Object.entries(s.chosen||{}))if(APP.local||!appIds.has(k))chosen[k]=v;
  Object.assign(chosen,APP.chosen||{});
  const chosenKey={};
  for(const[k,v]of Object.entries(s.chosenKey||{}))if(APP.local||!appIds.has(k))chosenKey[k]=v;
  Object.assign(chosenKey,APP.chosenKey||{});
  const positions=[...APP.positions,...own];
  const active=positions.some(p=>p.id===s.active)?s.active:null;
  return {...s,version:5,positions,chosen,chosenKey,active,marks:s.marks||{}};
};
let saveTimer=null, synced={...(APP.chosen||{})}, syncedKey={...(APP.chosenKey||{})}, revision=APP.revision, syncing=Promise.resolve();
const appStatus=(text,error)=>{const n=document.getElementById('app-status');if(n){n.textContent=text||'';n.className=error?'app-status error':'app-status'}};
const post=async(url,body)=>{
  const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'podbor'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||('Ошибка '+r.status));
  return d;
};
// «Выбрать» по позиции заявки идёт в счёт приложения: то же действие, что выбор товара в сравнении.
// What the page shows for the product: the server checks the invoice gets the same numbers.
function pagePrice(pos,product){
  if(!product)return null;
  const mp=modelOf(pos).products.find(p=>p.i===pos.products.indexOf(product));
  return mp?{unit_price:mp.unitPrice,buy:mp.buy,total:mp.total}:null;
}
function syncChosen(){
  if(APP.local)return; // on the stand «Выбрать» only marks the product
  for(const pos of APP.positions){
    const cur=state.chosen?.[pos.id]??null, prev=synced[pos.id]??null;
    if(cur===prev)continue;
    synced[pos.id]=cur;
    syncing=syncing.then(async()=>{
      const wanted=state.chosenKey?.[pos.id], product=cur==null?null:(pos.products.find(p=>p[0]===cur&&p[3]?.key===wanted)||pos.products.find(p=>p[0]===cur));
      try{
        appStatus(cur==null?'Убираю товар из счёта…':'Переношу выбор в счёт…');
        const d=await post(APP.action_url,cur==null
          ?{action:'value_unselect',position:pos.position,csrf:APP.csrf,revision}
          :{action:'value_accept_select',position:pos.position,key:product?.[3]?.key,csrf:APP.csrf,revision,page:pagePrice(pos,product)});
        revision=d.revision;syncedKey[pos.id]=cur==null?undefined:product?.[3]?.key;
        appStatus(cur==null?'Товар убран из счёта.':'Выбор сохранён в счёте.');
      }catch(e){
        synced[pos.id]=prev;if(state.chosenKey){if(syncedKey[pos.id]==null)delete state.chosenKey[pos.id];else state.chosenKey[pos.id]=syncedKey[pos.id]}
        if(prev==null)delete state.chosen[pos.id];else state.chosen[pos.id]=prev;
        appStatus('Позиция «'+pos.name+'»: '+e.message,true);
        storeState();render();
      }
    });
  }
}
function storeState(){
  if(APP.local){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}catch(e){}return}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const appIds=new Set(APP.positions.map(p=>p.id));

    if(CLASSES.has(w)&&w.includes('.')){add('Класс прочности',w,null,i);continue}

  for(const f of found){

// Built-in dictionary plus the words you assigned to a rubric on this page.
function lookup(w){
  const s=stem(w);

  const CANON={a2:'нерж. A2',a4:'нерж. A4',zn:'цинк','оцинкованный':'цинк','оцинк':'цинк','чёрный':'черный','сталь':'стальной','латунь':'латунный','медь':'медный','алюминий':'алюминиевый','чугун':'чугунный','пластик':'пластиковый','резина':'резиновый','полипропилен':'полипропиленовый','полиэтилен':'полиэтиленовый','поликарбонат':'поликарбонатный'};
  for(const[field,list]of Object.entries(WORD_DICT)){const x=list.find(x=>x===w||stem(x)===s);if(x)return {field,value:CANON[x]||x}}

/* ---------- Model of one position ---------- */
// A position is recomputed only when its own inputs change (marks, anchor, dictionary, products);
// the other positions of the request reuse what was computed before.
const modelCache=new Map();
function modelOf(pos){
  const key=JSON.stringify([pos.name,pos.qty,pos.unit,pos.products.length,state.marks?.[pos.id]||{},state.anchor?.[pos.id]||null,state.dict||{}]);
  const hit=modelCache.get(pos.id);
  if(hit&&hit.key===key&&hit.products===pos.products)return hit.M;
  const M=model(pos);
  M.ranked=()=>M.__ranked||(M.__ranked=M.rankAll(M.reference));
  modelCache.set(pos.id,{key,products:pos.products,M});
  return M;
}
function model(pos){

  const freq=new Map();

  for(const w of reqRaw)if(!freq.has(w))freq.set(w,0);

  const fkey=f=>'f|'+f.field+'|'+(f.field==='Тип товара'?stem(f.value):f.value);

      if(!labels.has(k)||f.field==='Тип товара'&&f.value===reqX.found.find(r=>r.field==='Тип товара')?.value)labels.set(k,f.value);

  const reqGuess=new Set(reqX.found.filter(f=>f.guess).map(fkey));

  const marks=new Map(), skipped=new Set();

  const valuesOf=p=>{const m=new Map();for(const k of p.words)if(k.startsWith('f|')&&!SKIP.has(fieldOf.get(k))){const f=fieldOf.get(k);if(!m.has(f))m.set(f,new Set());m.get(f).add(k)}return m};

/* ---------- Rendering ---------- */
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')n.className=v;else if(k.startsWith('on'))n[k]=v;else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v)}for(const c of kids.flat())if(c!=null&&c!==false)n.append(c.nodeType?c:String(c));return n};
const money=v=>v==null?'—':v.toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';
const num=v=>v==null?'—':v.toLocaleString('ru-RU',{maximumFractionDigits:3});

let assigning=null; const expanded=new Set();
// One vocabulary for all hints: выбрано мной / аналог / замена / исключено / из заявки / не выбрано.
const cap=t=>String(t).charAt(0).toUpperCase()+String(t).slice(1);
const stateWord=m=>!m?'не выбрано':m.by==='auto'?'из заявки':{only:'выбрано мной',also:'аналог / замена',rejected:'исключено'}[m.s];
function setMark(pos,word,next){
  const m=state.marks[pos.id]||(state.marks[pos.id]={});

  save();render();
}
function toggle(pos,word,decision,mark,isReq){

  else setMark(pos,word,decision);
}

function renderTabs(){

  for(const p of state.positions){
    tabs.append(el('button',{class:'tab',role:'tab','aria-selected':String(p.id===state.active),onclick:()=>{state.active=p.id;save();render()}},p.name.length>38?p.name.slice(0,36)+'…':p.name));
  }
  tabs.append(el('button',{class:'tab add',role:'tab','aria-selected':String(state.active==='new'),onclick:()=>{state.active='new';render()}},'+ Своя позиция'));
}

function renderPosition(pos){
  const M=modelOf(pos);

  // so a value that close products have is not hidden as «0».
  const shownCount=new Map();
  {const hid=new Set((state.hidden||{})[pos.id]||[]);
   for(const r of M.ranked())if(!hid.has(r.p.name)&&r.same.length>0&&r.dReq.length<=2&&(r.dReq.length===0||r.same.length>=2))
     for(const w of r.p.words)shownCount.set(w,(shownCount.get(w)||0)+1);}
  const main=el('div',{class:'pos-work'});
  main.append(el('div',{class:'req'},
    el('b',{},pos.name), el('span',{class:'meta'},`${num(pos.qty)} ${pos.unit}`),
    pos.example?el('span',{class:'note'},pos.example):null,

/* ---------- AI parsing, compared with the rules ----------
   One call to Claude with every request and product name; each value it returns must stand in the
   name word for word (its «evidence»), and its rubric must be one of ours — otherwise it is rejected. */
let sampleFn=null, aiBusy=false, aiError='', aiCtl=null;
(async()=>{try{sampleFn=await window.claude?.use?.('sample')}catch(e){sampleFn=null} render()})();
function aiNames(){
  const names=[];
  for(const pos of state.positions){names.push({kind:'Заявка',pos:pos.name,name:pos.name});for(const p of pos.products)names.push({kind:'Товар',pos:pos.name,name:p[0]})}
  return names;
}
const squash=s=>String(s||'').toLowerCase().replaceAll('ё','е').replace(/[×*х]/g,'x').replace(/\s+/g,' ').trim();
async function runAi(){
  if(!sampleFn||aiBusy)return;
  aiBusy=true;aiError='';render();
  const all=aiNames(), out={};
  aiCtl=new AbortController();
  try{
  // Batches of 20 names keep each answer well under the length limit.
  for(let from=0;from<all.length;from+=20){
  const names=all.slice(from,from+20);
  aiError=`Разобрано ${from} из ${all.length}…`;render();
  const prompt=`Ты разбираешь наименования строительных и промышленных товаров на характеристики.
Рубрики (используй только их; если значение не подходит ни к одной — пропусти его): ${FIELDS.join('; ')}.
Правила: значение пиши коротко с единицей (например «10 мм», «M8», «1 м», «AISI 304L», «FFP2»). Для каждого значения дай evidence — точный кусок исходного наименования, из которого оно взято, символ в символ. Ничего не придумывай: если в названии нет — не пиши. «Тип товара» — существительное, что это за товар (в именительном падеже, ед. числе).
Ответь только JSON-массивом той же длины и порядка: [{"i":0,"fields":[{"field":"Резьба","value":"M8","evidence":"М8"}]}].
Наименования:
${names.map((n,i)=>i+'. '+n.name).join('\n')}`;
    const res=await sampleFn.json(prompt,{signal:aiCtl.signal,cache:{gcTime:86400000}});
    for(const r of Array.isArray(res)?res:[]){
      const n=names[Number(r?.i)]; if(!n)continue;
      const text=squash(n.name);
      out[n.name]=(Array.isArray(r.fields)?r.fields:[]).map(f=>{
        const field=String(f?.field||''), value=String(f?.value||''), ev=String(f?.evidence||'');
        const why=!FIELDS.includes(field)?'рубрики нет в списке':!ev||!text.includes(squash(ev))?'нет в тексте названия':'';
        return {field,value,evidence:ev,why};
      });
    }
  }
    state.ai={at:new Date().toLocaleString('ru-RU'),names:out};aiError='';save();
  }catch(e){aiError=e?.code==='cancelled'?'':e?.code==='not_granted'?'Доступ к Claude для этой страницы не разрешён.':e?.code==='rate_limited'?'Слишком много запросов, попробуйте позже.':'Не удалось получить разбор: '+(e?.code||'ошибка')}
  finally{aiBusy=false;render()}
}
// The same value written two ways is one value: «zn» = «цинк», «1000 мм» = «1 м», «8,8» = «8.8».
function canonValue(field,value){
  const v=String(value||'').trim();
  const d=lookup(v.toLowerCase().replaceAll('ё','е'));
  if(d&&d.field===field)return d.value;
  const m=v.toLowerCase().replace(',','.').match(/^(\d+(?:\.\d+)?)\s*(мм|mm|см|м|m)$/);
  if(m&&['Длина','Ширина','Толщина','Размер','Диаметр'].includes(field)){const n=parseFloat(m[1])*({см:10,м:1000,m:1000}[m[2]]||1);return field==='Длина'||field==='Ширина'?len(n):fmt(n)+' мм'}
  if(field==='Резьба')return v.toUpperCase().replace('М','M').replace(/\s/g,'');
  if(field==='Класс прочности')return v.replace(',','.');
  return v;
}
// Rules vs AI for one name: same values, values only one side found, AI values rejected by the checks.
function compareParse(name){
  const rules=extract(name).found.filter(f=>f.field!=='Код / артикул').map(f=>({field:f.field,value:f.value}));
  const ai=((state.ai?.names||{})[name]||[]).map(f=>({...f,value:canonValue(f.field,f.value)}));
  const key=f=>f.field+'|'+squash(f.value).replace(/\s/g,'');
  const rk=new Set(rules.map(key)), ok=ai.filter(f=>!f.why&&f.field!=='Код / артикул'), ak=new Set(ok.map(key));
  return {same:rules.filter(f=>ak.has(key(f))),onlyRules:rules.filter(f=>!ak.has(key(f))),onlyAi:ok.filter(f=>!rk.has(key(f))),rejected:ai.filter(f=>f.why)};
}
function aiPanel(){
  const box=el('details',{class:'aipanel',open:!!state.aiOpen});
  box.addEventListener('toggle',()=>{state.aiOpen=box.open;save()});
  box.append(el('summary',{},'Разбор наименований: правила и ИИ'+(state.ai?` · ИИ от ${state.ai.at}`:'')));
  if(!sampleFn){box.append(el('p',{class:'note'},'ИИ не подключён: на сервере не задан ключ ANTHROPIC_API_KEY.'));return box}
  box.append(el('p',{class:'hint'},`Один запрос к Claude разбирает все ${aiNames().length} наименований (заявка и найденные товары). Значение ИИ принимается, только если оно буквально есть в названии и его рубрика — из нашего списка. Запрос расходует лимит вашего аккаунта Claude; первый раз Claude спросит разрешение.`),
    el('div',{class:'posnav'},el('button',{class:'btn',disabled:aiBusy,onclick:runAi},aiBusy?'ИИ разбирает… (до минуты)':state.ai?'Разобрать заново':'Разобрать ИИ'),
      aiBusy?el('button',{class:'btn',onclick:()=>aiCtl?.abort()},'Остановить'):null,aiError?el('span',{class:'note'},aiError):null));
  if(!state.ai)return box;
  let agree=0,diffs=0,rejected=0;
  const tb=el('tbody');
  for(const n of aiNames()){
    const c=compareParse(n.name); rejected+=c.rejected.length;
    if(!c.onlyRules.length&&!c.onlyAi.length){agree++;continue}
    diffs++;
    const list=(arr,cls)=>arr.map(f=>el('span',{class:'cmp '+cls},`${f.field}: ${f.value}`));
    tb.append(el('tr',{},el('td',{},el('div',{class:'note'},n.kind+(n.kind==='Товар'?' · '+n.pos.slice(0,30):'')),n.name),
      el('td',{},el('div',{class:'cmprow'},...list(c.onlyRules,'diff'))),
      el('td',{},el('div',{class:'cmprow'},...list(c.onlyAi,'s-also'))),
      el('td',{},el('div',{class:'cmprow'},...c.rejected.map(f=>el('span',{class:'cmp',title:f.why,style:'text-decoration:line-through;opacity:.6'},`${f.field}: ${f.value}`))))));
  }
  box.append(el('p',{class:'totals'},`Совпало полностью: ${agree} · расходятся: ${diffs} · значений ИИ отклонено проверкой: ${rejected} `,
    el('button',{class:'btn',onclick:async e=>{
      const lines=aiNames().map(n=>{const c=compareParse(n.name);if(!c.onlyRules.length&&!c.onlyAi.length&&!c.rejected.length)return null;
        const f=a=>a.map(x=>x.field+': '+x.value).join('; ');
        return `${n.name}\n  правила: ${f(c.onlyRules)||'—'}\n  ИИ: ${f(c.onlyAi)||'—'}`+(c.rejected.length?`\n  отклонено: ${f(c.rejected)}`:'')}).filter(Boolean);
      const text=`Совпало: ${agree}, расходятся: ${diffs}\n\n`+lines.join('\n');
      try{await navigator.clipboard.writeText(text);e.target.textContent='Скопировано'}catch(err){e.target.textContent='Не удалось скопировать'}
    }},'Скопировать расхождения')));
  if(diffs)box.append(el('div',{class:'tablewrap'},el('table',{},el('thead',{},el('tr',{},el('th',{},'Наименование'),el('th',{},'Нашли только правила'),el('th',{},'Нашёл только ИИ'),el('th',{},'ИИ, отклонено проверкой'))),tb)));
  return box;
}

/* ---------- AI choice for one position, checked by the rules ----------
   Claude rates every found product against the request; the request's numbers and sizes (as the rules read
   them) must be in the product, otherwise «подходит» is lowered to «проверить». Rules can lower, never raise. */
const NUMERIC=new Set(['Резьба','Длина','Ширина','Толщина','Диаметр','Посадка','Размер','Размеры','Условный проход','Давление','Сечение','Напряжение','Мощность','Ток','Объём','Масса','Зернистость','Типоразмер']);
const pickBusy=new Set(); const pickErr={}; const pickCtl={};
async function runPick(pos){
  if(!sampleFn||pickBusy.has(pos.id))return;
  pickBusy.add(pos.id);delete pickErr[pos.id];render();
  const list=pos.products.map((p,i)=>`${i}. ${p[0]} — ${p[1]} ₽ за ${p[2]||'шт'}`).join('\n');
  const prompt=`Ты снабженец. Нужно подобрать товар под позицию заявки.
Позиция заявки: «${pos.name}», количество ${pos.qty} ${pos.unit}.
Найденные товары поставщика:
${list}

Оцени КАЖДЫЙ товар: "подходит" — это то же изделие с теми же существенными параметрами (размеры, резьба, материал, класс); "аналог" — может заменить, но есть отличие (назови его); "не подходит" — другое изделие или существенный параметр другой. Не выдумывай параметры, которых нет в названии; если в названии чего-то не хватает для уверенности — это "аналог" с отличием «не указано: …». Цена на оценку не влияет.
"best" — только товар с оценкой "подходит"; если такого нет, best = null. В "best_reason" одной фразой объясни выбор.
Ответь только JSON: {"best": номер или null, "best_reason": "…", "items":[{"i":0,"verdict":"подходит|аналог|не подходит","reason":"коротко, словами из названия","differences":["…"]}]}`;
  pickCtl[pos.id]=new AbortController();
  try{
    const res=await sampleFn.json(prompt,{signal:pickCtl[pos.id].signal,cache:{gcTime:86400000}});
    const items=(Array.isArray(res?.items)?res.items:[]).filter(x=>pos.products[Number(x?.i)]).map(x=>({i:Number(x.i),verdict:['подходит','аналог','не подходит'].includes(x.verdict)?x.verdict:'аналог',reason:String(x.reason||''),differences:(Array.isArray(x.differences)?x.differences:[]).map(String)}));
    state.aiPick=state.aiPick||{};
    // A «best» is kept only when the AI itself rated that product «подходит».
    const best=Number.isInteger(res?.best)&&items.find(x=>x.i===res.best&&x.verdict==='подходит')?res.best:null;
    state.aiPick[pos.id]={at:new Date().toLocaleString('ru-RU'),best,bestReason:best!=null?String(res?.best_reason||''):'',items};save();
  }catch(e){pickErr[pos.id]=e?.code==='cancelled'?'':e?.code==='not_granted'?'Доступ к Claude для этой страницы не разрешён.':e?.code==='rate_limited'?'Слишком много запросов, попробуйте позже.':'Не удалось получить подбор: '+(e?.code||'ошибка')}
  finally{pickBusy.delete(pos.id);render()}
}
/* «Спросить ИИ»: a free question about one position. Claude sees the request, every found product with its
   price per request unit, your marks and the AI choice; the short conversation is kept per position. */
const askBusy=new Set(), askCtl={}, askLive={};
async function runAsk(pos,M,question){
  if(!sampleFn||askBusy.has(pos.id)||!question.trim())return;
  const chat=(state.aiChat=state.aiChat||{})[pos.id]=(state.aiChat[pos.id]||[]);
  const goods=M.products.map((p,i)=>`${i}. ${p.name} — ${p.price} ₽ за ${p.unit}`+(p.unitPrice!=null?`; ${Math.round(p.unitPrice*100)/100} ₽ за ${pos.unit}, купить ${p.buy} ${p.unit}`:'; пересчёт в единицы заявки неизвестен')).join('\n');
  const marks=[...M.marks].map(([k,m])=>({only:'обязательно',also:'аналог',rejected:'исключено'}[m.s]+': '+M.named(k))).join('; ')||'нет';
  const pick=state.aiPick?.[pos.id]?.items?.map(x=>`${x.i}: ${x.verdict}`).join(', ')||'не запускался';
  const context=`Ты помогаешь снабженцу разобраться с позицией заявки. Отвечай по-русски, коротко и по делу, опирайся только на данные ниже; если данных не хватает — так и скажи, ничего не выдумывай. Цены не пересчитывай заново, если они уже даны.
Позиция заявки: «${pos.name}», ${pos.qty} ${pos.unit}.
Найденные товары:
${goods}
Отметки снабженца: ${marks}.
Оценки подбора ИИ: ${pick}.`;
  chat.push({role:'user',content:question.trim()});
  askBusy.add(pos.id);askLive[pos.id]='';render();
  askCtl[pos.id]=new AbortController();
  try{
    const turns=[{role:'user',content:context},...chat.slice(-8)];
    const {text}=await sampleFn(turns,{cache:false,signal:askCtl[pos.id].signal,onText:({text})=>{askLive[pos.id]=text;const n=document.getElementById('ask-live-'+pos.id);if(n)n.textContent=text}});
    chat.push({role:'assistant',content:text});
  }catch(e){
    chat.push({role:'assistant',content:(e?.text?e.text+'\n\n':'')+(e?.code==='cancelled'?'(остановлено)':e?.code==='not_granted'?'Доступ к Claude для этой страницы не разрешён.':e?.code==='rate_limited'?'Слишком много запросов, попробуйте позже.':'Не удалось получить ответ: '+(e?.code||'ошибка'))});
  }finally{askBusy.delete(pos.id);delete askLive[pos.id];save();render()}
}
function askBlock(pos,M){
  const box=el('div',{class:'ask'});
  const chat=state.aiChat?.[pos.id]||[];
  for(const t of chat.slice(-6))box.append(el('div',{class:'ask-msg '+(t.role==='user'?'q':'a')},t.content));
  if(askBusy.has(pos.id))box.append(el('div',{class:'ask-msg a',id:'ask-live-'+pos.id},askLive[pos.id]||'Думаю…'));
  const input=el('textarea',{id:'ask-'+pos.id,rows:2,placeholder:'Например: чем отличаются рулоны 1,4x20 и 1,4x25? Можно ли штангу вместо шпильки?',disabled:askBusy.has(pos.id)});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();runAsk(pos,M,input.value)}});
  box.append(el('div',{class:'ask-row'},input,
    askBusy.has(pos.id)?el('button',{class:'btn',onclick:()=>askCtl[pos.id]?.abort()},'Остановить'):el('button',{class:'btn',onclick:()=>runAsk(pos,M,input.value)},'Спросить ИИ'),
    chat.length&&!askBusy.has(pos.id)?el('button',{class:'btn',onclick:()=>{delete state.aiChat[pos.id];save();render()}},'Очистить'):null));
  return box;
}
function aiPickPanel(pos,M){
  const box=el('section',{class:'panel aipick','aria-label':'Подбор ИИ'});
  const saved=state.aiPick?.[pos.id], busy=pickBusy.has(pos.id);
  box.append(el('div',{class:'posnav'},el('b',{},'Подбор ИИ'),
    sampleFn?el('button',{class:'btn',disabled:busy,onclick:()=>runPick(pos)},busy?'ИИ оценивает товары… (до минуты)':saved?'Подобрать заново':'Подобрать ИИ'):el('span',{class:'note'},'ИИ не подключён: на сервере не задан ключ ANTHROPIC_API_KEY.'),
    busy?el('button',{class:'btn',onclick:()=>pickCtl[pos.id]?.abort()},'Остановить'):null,
    pickErr[pos.id]?el('span',{class:'note'},pickErr[pos.id]):null,
    saved?el('span',{class:'note'},`от ${saved.at} · числа и размеры заявки проверяются правилами`):null));
  if(sampleFn)box.append(askBlock(pos,M));
  if(!saved)return box;
  const reqNums=[...M.reqWords].filter(k=>k.startsWith('f|')&&NUMERIC.has(M.fieldOf.get(k)));
  const order={'подходит':0,'проверить':1,'аналог':2,'не подходит':3};
  const rows=saved.items.map(x=>{
    const p=M.products[x.i]; const missing=reqNums.filter(k=>!p.words.has(k));
    const verdict=x.verdict==='подходит'&&missing.length?'проверить':x.verdict;
    return {...x,p,missing,verdict};
  }).sort((a,b)=>order[a.verdict]-order[b.verdict]||(a.p.unitPrice??Infinity)-(b.p.unitPrice??Infinity));
  const shown=rows.filter(r=>r.verdict!=='не подходит'), hidden=rows.length-shown.length;
  const tb=el('tbody');
  for(const r of shown){
    const pill={'подходит':'done','проверить':'todo','аналог':'todo','не подходит':'miss'}[r.verdict];
    tb.append(el('tr',{},
      el('td',{},el('span',{class:'pill '+pill},r.verdict),r.i===saved.best&&r.verdict==='подходит'?el('div',{class:'bestmark',title:saved.bestReason||''},'★ выбор ИИ'):null),
      el('td',{},r.p.name,el('div',{class:'note'},r.reason),
        r.differences.length?el('div',{class:'neardiff'},'отличия: '+r.differences.join('; ')):null,
        r.missing.length?el('div',{class:'cmprow'},...r.missing.map(k=>el('span',{class:'cmp diff'},'не подтверждено: '+M.named(k)))):null),
      el('td',{class:'num'},money(r.p.unitPrice)),
      el('td',{},el('button',{class:'btn'+(isChosen(pos,r.p)?' chosen':''),type:'button',onclick:()=>chooseToggle(pos,r.p)},isChosen(pos,r.p)?'Выбрано ✓':'Выбрать'))));
  }
  box.append(el('div',{class:'tablewrap'},el('table',{},el('thead',{},el('tr',{},el('th',{},'Оценка'),el('th',{},'Товар и обоснование ИИ'),el('th',{},'Цена за ед. заявки'),el('th',{},''))),tb)));
  if(hidden)box.append(el('p',{class:'note'},`ИИ отнёс к «не подходит»: ${hidden} товаров — они не показаны.`));
  return box;
}

// Status of a position in the whole request.
function status(pos){
  if(!pos.products.length)return {code:'none',text:'Поиск не запускался'};
  const M=modelOf(pos);
  const chosen=state.chosen?.[pos.id]!=null&&M.products.find(p=>p.name===state.chosen[pos.id]);
  if(chosen)return {code:'done',text:'Выбрано',offer:chosen};
  const ranked=M.ranked(), fit=ranked.filter(r=>r.dReq.length===0&&r.same.length>0&&r.p.unitPrice!=null), cheap=l=>[...l].sort((a,b)=>a.p.unitPrice-b.p.unitPrice)[0]?.p;
  const best=cheap(fit.filter(r=>!r.unknown.length))||cheap(fit);
  const near=ranked.find(r=>r.dReq.length<=2&&r.same.length>=2&&r.p.unitPrice!=null)?.p;
  return best?{code:'todo',text:'Нужно решение',offer:best,recommended:true}:near?{code:'todo',text:'Нужно решение',offer:near,recommended:true,closeOnly:true}:{code:'miss',text:'Не найдено'};
}
const STATUS_ORDER=[['all','Все'],['todo','Нужно решение'],['done','Выбрано'],['miss','Не найдено'],['none','Поиск не запускался']];
function render(){
  const main=document.getElementById('main');main.replaceChildren();
  const tabs=document.getElementById('tabs');tabs.replaceChildren();
  if(state.active==='new'){
    tabs.append(el('button',{class:'tab',onclick:()=>{state.active=null;render()}},'← К заявке'));
    renderNew();return;
  }
  const rows=state.positions.map((pos,i)=>({pos,n:i+1,st:status(pos)}));
  const filter=state.filter||'all';
  for(const[code,label]of STATUS_ORDER){
    const count=code==='all'?rows.length:rows.filter(r=>r.st.code===code).length;
    tabs.append(el('button',{class:'tab',role:'tab','aria-selected':String(filter===code),onclick:()=>{state.filter=code;save();render()}},`${label} (${count})`));
  }
  tabs.append(el('button',{class:'tab add',onclick:()=>{state.active='new';render()}},'+ Своя позиция'));
  main.append(aiPanel());
  const shown=rows.filter(r=>filter==='all'||r.st.code===filter);
  const done=rows.filter(r=>r.st.code==='done');
  const sum=done.reduce((s,r)=>s+(r.st.offer.total||0),0);
  main.append(el('p',{class:'totals'},`Выбрано: ${done.length} из ${rows.length} · Итого по выбранным: `,el('b',{},money(sum))));
  const order=rows.filter(r=>r.st.code==='todo').map(r=>r.pos.id);
  const go=id=>{state.active=id;save();render();setTimeout(()=>document.getElementById('row-'+id)?.scrollIntoView({block:'start',behavior:'smooth'}),0)};
  const tb=el('tbody');
  for(const r of shown){
    const open=state.active===r.pos.id, o=r.st.offer;
    tb.append(el('tr',{id:'row-'+r.pos.id,class:'sumrow'+(open?' open':''),tabindex:0,onclick:()=>{state.active=open?null:r.pos.id;save();render()},onkeydown:e=>{if(e.key==='Enter'){state.active=open?null:r.pos.id;save();render()}}},
      el('td',{class:'num'},String(r.n)),el('td',{},el('span',{class:'caret'},open?'▾ ':'▸ '),r.pos.name),el('td',{class:'num'},num(r.pos.qty)),el('td',{},r.pos.unit),
      el('td',{},el('span',{class:'pill '+r.st.code},r.st.text)),
      el('td',{},o?o.name:'—',o&&r.st.recommended?el('div',{class:'note'},r.st.closeOnly?'точного нет, ближайший по характеристикам':'рекомендовано: лучшая цена'):null),
      el('td',{class:'num'},o?money(o.unitPrice):'—'),el('td',{class:'num'},o?money(o.total):'—')));
    if(open){
      const i=state.positions.indexOf(r.pos);
      const prev=state.positions[i-1], next=state.positions[i+1], nextTodo=order.find(id=>state.positions.findIndex(p=>p.id===id)>i)||order.find(id=>id!==r.pos.id);
      const nav=el('div',{class:'posnav'},
        el('button',{class:'btn',disabled:!prev,onclick:()=>prev&&go(prev.id)},'← Предыдущая'),
        el('button',{class:'btn',disabled:!next,onclick:()=>next&&go(next.id)},'Следующая →'),
        el('button',{class:'btn',disabled:!nextTodo,onclick:()=>nextTodo&&go(nextTodo)},'Следующая нерешённая →'),
        r.pos.example?el('span',{class:'note'},r.pos.example):el('button',{class:'btn',onclick:()=>{state.positions=state.positions.filter(p=>p.id!==r.pos.id);delete state.marks[r.pos.id];state.active=null;save();render()}},'Удалить позицию'));
      const work=r.pos.products.length?renderPosition(r.pos):el('p',{class:'note'},'Товаров нет: поиск по этой позиции не запускался. Когда приложение снова получит доступ к базе, сюда попадут найденные товары.');
      tb.append(el('tr',{class:'workrow'},el('td',{colspan:8},nav,work)));
    }
  }
  main.append(el('div',{class:'tablewrap'},el('table',{class:'summary-table'},
    el('thead',{},el('tr',{},...['№','Наименование заявки','Кол-во','Ед.','Статус','Предложение','Цена за ед. заявки','Сумма'].map(h=>el('th',{},h)))),tb)));
}
